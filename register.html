<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrise Hospital | Register Receptionist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .register-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
    }
    .register-card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 1rem 2.5rem rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }
    .brand-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d6efd, #20c997);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      margin: 0 auto 1rem;
    }
    .bg-shape {
      position: absolute;
      inset: -20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(13,110,253,0.15), rgba(32,201,151,0.15));
      z-index: 1;
      filter: blur(30px);
    }
  </style>
</head>
<body>

  <div class="register-wrapper">
    <div class="bg-shape"></div>
    <div class="register-card">
      <div class="text-center mb-3">
        <div class="brand-badge">
          <i class="fas fa-user-plus"></i>
        </div>
        <h4 class="mb-0">Sunrise Hospital</h4>
        <p class="text-muted">Receptionist Registration</p>
      </div>

      <form id="registerForm" action="register.php" method="POST" class="needs-validation" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" required />
          <div class="invalid-feedback">Full name is required.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required />
          <div class="invalid-feedback">Username is required.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required />
          <div class="invalid-feedback">Valid email is required.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="form-control" placeholder="+254712345678" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" class="form-control" required minlength="6" />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="fas fa-eye"></i>
            </button>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
          <i class="fas fa-user-check me-2"></i>Create Account
        </button>

        <div class="text-center">
          <small class="text-muted">Already registered?</small>
          <a href="login.html" class="text-decoration-none">Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Bootstrap-style validation
    (function() {
      const form = document.getElementById('registerForm');
      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const formData = new FormData(form);

        try {
          const response = await fetch('register.php', {
            method: 'POST',
            body: formData,
            credentials: 'same-origin'
          });

          const data = await response.json();

          if (data.status === 'success') {
            alert('Account created!.');
            window.location.href = 'index.html';
          } else {
            alert(data.message || 'Registration failed. Please try again.');
          }
        } catch (error) {
          console.error(error);
          alert('An error occurred. Please try again later.');
        }
      });
    })();

    // Password visibility toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.querySelector('input[name="password"]');
      const icon = this.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
